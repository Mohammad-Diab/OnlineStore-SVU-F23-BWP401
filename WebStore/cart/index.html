<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lib/fontAwesome/css/all.min.css">
    <link rel="stylesheet" href="../lib/Bootstrap/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../style/fonts.css">
    <link rel="stylesheet" href="../style/style.css">
    <title>عربة التسوق</title>
</head>

<body class="login-body-backgound" dir="rtl">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../home/">متجرنا</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../home/">الصفحة الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../products">المنتجات</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../store">متجري الشخصي</a>
                    </li>
                </ul>
            </div>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item me-2">
                        <a class="btn btn-light" href="../cart">العربة</a>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link text-danger" onclick="logout()">خروج</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div style="height: calc(100% - 84px);" class="login-body">
        <div class="container d-flex align-items-center justify-content-center w-50 card shadow">
            <div class="card-body p-4 w-100 h-50">
                <h2>عربة التسوق</h2>
                <div style="max-height: 320px; overflow-y: auto;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>المعرف</th>
                                <th>العنصر</th>
                                <th>الكمية</th>
                                <th>السعر</th>
                                <th>الاجمالي</th>
                                <th>الاجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="cartTable">
                            <tr>
                                <td colspan="6" class="text-center fs-4">يتم الآن التحميل...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p class="text-end fs-4 mt-4"><span>السعر الاجمالي: </span><span class="text-end" id="totalPrice"></span></p>
                <div class="text-center">
                    <a id="buyNow" href="../buynow" class="btn btn-primary mt-5 mb-4 disabled" disabled>شراء الآن</a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="changeQuantityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">تغيير الكمية - <span id="productTitle"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm" class="needs-validation" novalidate onsubmit="updateQuantity(event)">
                        <div class="mb-3">
                            <label for="stock" class="form-label">العدد المتوفر</label>
                            <input style="direction: rtl;" type="number" class="form-control rtl" id="stock" name="stock" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">الكمية</label>
                            <input style="direction: rtl;" type="number" class="form-control" min="1" id="quantity" name="quantity">
                            <div class="invalid-feedback" id="quantityError">هذا الحقل مطلوب</div>
                        </div>
                        <div class="text-center">
                            <button id="submitBtn" type="submit" class="btn btn-primary">تغيير</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center">©️ 2023 جميع الحقوق محفوظة</footer>
    <script src="../lib/jQuery/jQuery.js"></script>
    <script src="../lib/Bootstrap/js/bootstrap.min.js"></script>
    <script src="../script/common.js"></script>
    <script src="../script/common.js"></script>
    <script src="../script/cart.js"></script>
</body>

</html>
